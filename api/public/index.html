<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS SMS — Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-cream-paper: #ffffeb;
      --color-midnight-ink: #1a1a1a;
      --color-white: #ffffff;
      --color-stone-mist: #e4e4d0;
      --color-graphite-veil: #8a8a80;
      --color-smoke: #5f5f59;
      --color-charcoal: #222222;
      --color-deep-forest-teal: #034f46;
      --color-lavender-whisper: #f0d7ff;
      --color-amber-pulse: #ffa946;

      --font-figtree: 'Figtree', ui-sans-serif, system-ui, sans-serif;
      --font-eb-garamond: 'EB Garamond', Georgia, serif;

      --text-caption: 14px;
      --leading-caption: 1.3;
      --text-body: 16px;
      --leading-body: 1.35;
      --text-subheading: 20px;

      --spacing-8: 8px;
      --spacing-16: 16px;
      --spacing-24: 24px;
      --spacing-32: 32px;
      --spacing-40: 40px;
      --spacing-48: 48px;

      --page-max-width: 1280px;
      --radius-nav: 14px;
      --radius-cards: 32px;
      --radius-buttons: 14px;
      --radius-smallbadges: 8px;
      --radius-badges: 1000px;
      --nav-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      --pane-pad: var(--spacing-24);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-cream-paper);
      color: var(--color-midnight-ink);
      font-family: var(--font-figtree);
      font-size: var(--text-body);
      line-height: var(--leading-body);
      min-height: 100vh;
    }

    .page {
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: var(--spacing-24) 40px var(--spacing-48);
      display: flex;
      flex-direction: column;
      gap: var(--spacing-24);
    }

    @media (max-width: 900px) {
      .page { padding: var(--spacing-16) 20px var(--spacing-40); }
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: var(--spacing-16);
      background: var(--color-white);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-nav);
      padding: 10px 16px;
      box-shadow: var(--nav-shadow);
    }

    .wordmark {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .wordmark .muted { color: var(--color-graphite-veil); }
    .wordmark .accent { color: var(--color-midnight-ink); }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-status {
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-smoke);
    }

    .btn {
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      font-weight: 600;
      line-height: 1;
      border-radius: var(--radius-buttons);
      padding: 10px 18px;
      cursor: pointer;
      transition: opacity 0.15s;
      border: 1px solid var(--color-midnight-ink);
      background: transparent;
      color: var(--color-midnight-ink);
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary {
      background: var(--color-lavender-whisper);
    }
    .btn-small {
      padding: 8px 12px;
      font-size: 12px;
    }
    .btn-quiet {
      border-color: var(--color-stone-mist);
      color: var(--color-smoke);
      background: var(--color-white);
    }

    .banner {
      background: var(--color-deep-forest-teal);
      color: var(--color-white);
      padding: 14px 24px;
      text-align: center;
      font-size: var(--text-caption);
      font-weight: 500;
      border-radius: var(--radius-nav);
    }
    .banner[hidden] { display: none; }

    .intro {
      padding: var(--spacing-8) 4px 0;
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-white);
      background: var(--color-deep-forest-teal);
      border-radius: var(--radius-badges);
      padding: 6px 14px;
      margin-bottom: 12px;
    }

    .intro h1 {
      font-family: var(--font-eb-garamond);
      font-weight: 400;
      font-size: clamp(40px, 6vw, 56px);
      line-height: 0.95;
      letter-spacing: -0.05em;
    }
    .intro h1 .muted { color: var(--color-graphite-veil); }
    .intro h1 .accent { color: var(--color-midnight-ink); }

    .intro p {
      margin-top: 12px;
      max-width: 48ch;
      color: var(--color-smoke);
      font-size: 16px;
      font-weight: 400;
    }

    .workspace {
      display: grid;
      grid-template-columns: 280px minmax(300px, 1fr) minmax(320px, 1.05fr);
      gap: var(--spacing-24);
      align-items: stretch;
      min-height: 640px;
    }

    @media (max-width: 1100px) {
      .workspace {
        grid-template-columns: 1fr;
        min-height: auto;
      }
    }

    .panel {
      background: var(--color-white);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-cards);
      display: flex;
      flex-direction: column;
      min-height: 0;
      overflow: hidden;
    }

    .panel-head {
      padding: var(--spacing-24) var(--pane-pad) var(--spacing-16);
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .panel-kicker {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-white);
      background: var(--color-deep-forest-teal);
      border-radius: var(--radius-badges);
      padding: 5px 12px;
      display: inline-block;
      margin-bottom: 10px;
    }

    .panel-title {
      font-size: var(--text-subheading);
      font-weight: 600;
      line-height: 1.2;
      color: var(--color-midnight-ink);
    }

    .panel-subtitle {
      margin-top: 6px;
      font-size: var(--text-caption);
      color: var(--color-smoke);
      font-weight: 500;
    }

    .panel-toolbar {
      padding: 0 var(--pane-pad) var(--spacing-16);
    }

    .panel-toolbar select,
    .field {
      width: 100%;
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-midnight-ink);
      background: var(--color-cream-paper);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-smallbadges);
      padding: 10px 12px;
    }

    .start-chat {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .start-chat .field { flex: 1; }

    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-16) var(--pane-pad) var(--spacing-24);
      min-height: 0;
      background: var(--color-cream-paper);
    }

    .stack {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card-item {
      width: 100%;
      text-align: left;
      font-family: var(--font-figtree);
      color: inherit;
      background: var(--color-white);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-nav);
      padding: 18px;
      cursor: pointer;
      transition: border-color 0.15s, box-shadow 0.15s;
      display: block;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    }
    .card-item:hover {
      border-color: var(--color-graphite-veil);
    }
    .card-item.active {
      border-color: var(--color-deep-forest-teal);
      box-shadow: inset 0 0 0 1px var(--color-deep-forest-teal);
    }

    .card-title {
      font-size: var(--text-body);
      font-weight: 600;
      line-height: 1.25;
      color: var(--color-midnight-ink);
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-smoke);
    }

    .card-preview {
      margin-top: 6px;
      font-size: var(--text-caption);
      color: var(--color-graphite-veil);
      font-weight: 500;
    }

    .card-actions {
      margin-top: 14px;
    }

    /* One cohesive message unit */
    .msg-card {
      display: flex;
      flex-direction: column;
      gap: 0;
      padding: 0;
      overflow: hidden;
    }

    .msg-card .msg-top {
      padding: 16px 18px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg-card .msg-from {
      font-size: 16px;
      font-weight: 600;
      color: var(--color-midnight-ink);
      letter-spacing: -0.01em;
      line-height: 1.2;
    }

    .msg-card .msg-status {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .msg-card .msg-sub {
      font-size: 12px;
      font-weight: 500;
      line-height: 1.3;
      color: var(--color-graphite-veil);
    }

    .msg-card .msg-text {
      margin: 0 12px 12px;
      padding: 12px 14px;
      background: var(--color-cream-paper);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-smallbadges);
      font-size: 15px;
      line-height: 1.45;
      color: var(--color-midnight-ink);
      word-break: break-word;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: var(--radius-badges);
      background: rgba(3, 79, 70, 0.1);
      color: var(--color-deep-forest-teal);
      line-height: 1;
      flex-shrink: 0;
    }
    .pill.out {
      background: var(--color-stone-mist);
      color: var(--color-smoke);
    }

    .phone-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .phone-copy .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--color-graphite-veil);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, background 0.15s;
    }
    .phone-copy:hover .copy-btn,
    .phone-copy .copy-btn:focus { opacity: 1; }
    .phone-copy .copy-btn:hover {
      background: var(--color-stone-mist);
      color: var(--color-midnight-ink);
    }
    .phone-copy .copy-btn svg { width: 13px; height: 13px; }

    .phone-nickname-input {
      width: 100%;
      font-family: var(--font-figtree);
      font-size: var(--text-body);
      font-weight: 600;
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-smallbadges);
      padding: 8px 10px;
      background: var(--color-white);
      color: var(--color-midnight-ink);
    }

    .empty {
      padding: var(--spacing-32) var(--spacing-8);
      color: var(--color-smoke);
      font-size: var(--text-caption);
      font-weight: 500;
      text-align: center;
    }

    .chat-panel .panel-body {
      padding: 0;
      display: flex;
      flex-direction: column;
    }

    .chat-empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: var(--spacing-48) var(--spacing-24);
      text-align: center;
      color: var(--color-smoke);
      font-size: var(--text-caption);
      font-weight: 500;
      background: var(--color-cream-paper);
      min-height: 360px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: var(--spacing-24);
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--color-cream-paper);
      min-height: 360px;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 14px;
      border-radius: 16px;
      font-size: var(--text-caption);
      line-height: 1.4;
      word-break: break-word;
    }
    .bubble.in {
      align-self: flex-start;
      background: var(--color-white);
      border: 1px solid var(--color-stone-mist);
      color: var(--color-midnight-ink);
      border-bottom-left-radius: 6px;
    }
    .bubble.out {
      align-self: flex-end;
      background: var(--color-deep-forest-teal);
      color: var(--color-white);
      border-bottom-right-radius: 6px;
    }
    .bubble time {
      display: block;
      margin-top: 6px;
      font-size: 11px;
      font-weight: 500;
      opacity: 0.7;
    }

    .compose {
      display: flex;
      gap: 12px;
      align-items: flex-end;
      padding: var(--spacing-16) var(--pane-pad) var(--spacing-24);
      border-top: 1px solid var(--color-stone-mist);
      background: var(--color-white);
    }
    .compose textarea {
      flex: 1;
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-nav);
      padding: 12px 14px;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      background: var(--color-cream-paper);
      color: var(--color-midnight-ink);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--color-midnight-ink);
      color: var(--color-white);
      padding: 14px 20px;
      border-radius: var(--radius-buttons);
      font-size: var(--text-caption);
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="page">
    <header class="nav">
      <div class="wordmark"><span class="muted">AWS</span><span class="accent">SMS</span></div>
      <div class="nav-actions">
        <div class="nav-status" id="status">Loading…</div>
        <button class="btn btn-quiet" type="button" id="refresh-btn">Refresh</button>
        <button class="btn btn-quiet" type="button" id="logout-btn" hidden>Sign out</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
    </div>

    <section class="intro">
      <div class="badge">Inbox</div>
      <h1><span class="muted">SMS</span> <span class="accent">workspace</span></h1>
      <p>Pick a pool number to read its messages, then open a chat to reply.</p>
    </section>

    <div class="workspace">
      <aside class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-kicker">Numbers</div>
            <h2 class="panel-title">Phone pool</h2>
          </div>
        </div>
        <div class="panel-toolbar">
          <select id="phone-sort" aria-label="Sort phone numbers">
            <option value="date-added" selected>Sort by date added</option>
            <option value="last-messaged">Sort by last messaged</option>
          </select>
        </div>
        <div class="panel-body">
          <ul class="stack" id="phone-list">
            <li class="empty">Loading…</li>
          </ul>
        </div>
      </aside>

      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-kicker">Activity</div>
            <h2 class="panel-title" id="activity-title">All messages</h2>
            <p class="panel-subtitle" id="activity-subtitle">Messages across every pool number</p>
          </div>
        </div>
        <div class="panel-toolbar" id="new-chat-bar" hidden>
          <div class="start-chat">
            <input class="field" id="new-chat-number" type="tel" placeholder="+1…" aria-label="New chat number" />
            <button class="btn btn-small" type="button" data-action="start-chat">Open</button>
          </div>
        </div>
        <div class="panel-body" id="activity-wrap">
          <p class="empty">Loading…</p>
        </div>
      </section>

      <section class="panel chat-panel" id="chat-pane" data-empty="true">
        <div class="panel-head" id="chat-head">
          <div>
            <div class="panel-kicker">Chat</div>
            <h2 class="panel-title">Conversation</h2>
            <p class="panel-subtitle">Select a message to reply</p>
          </div>
        </div>
        <div class="panel-body" id="chat-wrap">
          <div class="chat-empty-state">Select a message to open the chat.</div>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const phoneListEl = document.getElementById('phone-list');
    const phoneSortEl = document.getElementById('phone-sort');
    const activityWrap = document.getElementById('activity-wrap');
    const activityTitle = document.getElementById('activity-title');
    const activitySubtitle = document.getElementById('activity-subtitle');
    const newChatBar = document.getElementById('new-chat-bar');
    const chatPane = document.getElementById('chat-pane');
    const chatHead = document.getElementById('chat-head');
    const chatWrap = document.getElementById('chat-wrap');
    const toast = document.getElementById('toast');

    let phoneNumbers = [];
    let nicknameLookup = new Map();
    let selectedPool = null;
    let selectedRemote = null;
    let allMessages = [];
    let phoneSort = phoneSortEl?.value || 'date-added';

    function messagePool(m) {
      return m.poolNumber || (m.direction === 'outbound' ? m.fromNumber : m.toNumber);
    }
    function messageRemote(m) {
      return m.remoteNumber || (m.direction === 'outbound' ? m.toNumber : m.fromNumber);
    }
    function messageDirection(m) {
      return m.direction === 'outbound' ? 'outbound' : 'inbound';
    }

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/login.html';
        throw new Error('Sign in required');
      }
      return res;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.className = 'toast show';
      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const COPY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

    function phoneCopyHtml(phoneNumber) {
      return `<span class="phone-copy"><span>${escapeHtml(phoneNumber)}</span><button class="copy-btn" type="button" data-action="copy-phone" data-phone="${escapeHtml(phoneNumber)}" title="Copy" aria-label="Copy phone number">${COPY_ICON}</button></span>`;
    }

    async function copyPhoneNumber(phoneNumber) {
      try {
        await navigator.clipboard.writeText(phoneNumber);
        showToast(`Copied ${phoneNumber}`);
      } catch {
        showToast('Could not copy');
      }
    }

    function fmtDate(iso) {
      try {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        if (sameDay) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch {
        return iso;
      }
    }

    function nicknameFor(number) {
      return nicknameLookup.get(number) ?? number;
    }

    function filteredMessages(messages) {
      if (!selectedPool) return messages;
      return messages.filter((m) => messagePool(m) === selectedPool);
    }

    function updateStatus(messages) {
      const visible = filteredMessages(messages);
      if (selectedPool) {
        statusEl.textContent = `${visible.length} of ${messages.length} messages`;
      } else {
        statusEl.textContent = `${messages.length} message${messages.length === 1 ? '' : 's'}`;
      }
    }

    function lastMessagedByPhone(messages) {
      const map = new Map();
      for (const m of messages) {
        const pool = messagePool(m);
        const current = map.get(pool);
        if (!current || m.receivedAt > current) map.set(pool, m.receivedAt);
      }
      return map;
    }

    function threadMessages(poolNumber, remoteNumber, messages) {
      return messages
        .filter((m) => messagePool(m) === poolNumber && messageRemote(m) === remoteNumber)
        .sort((a, b) => a.receivedAt.localeCompare(b.receivedAt));
    }

    function sortPhoneNumbers(numbers, sortMode, lastMessaged) {
      return [...numbers].sort((a, b) => {
        if (sortMode === 'last-messaged') {
          const aTs = lastMessaged.get(a.phoneNumber) ?? '';
          const bTs = lastMessaged.get(b.phoneNumber) ?? '';
          if (aTs === bTs) return a.phoneNumber.localeCompare(b.phoneNumber);
          if (!aTs) return 1;
          if (!bTs) return -1;
          return bTs.localeCompare(aTs);
        }
        const aTs = a.createdAt ?? '';
        const bTs = b.createdAt ?? '';
        if (aTs === bTs) return a.phoneNumber.localeCompare(b.phoneNumber);
        if (!aTs) return 1;
        if (!bTs) return -1;
        return bTs.localeCompare(aTs);
      });
    }

    function renderPhones(numbers) {
      phoneNumbers = numbers;
      nicknameLookup = new Map(numbers.map((p) => [p.phoneNumber, p.nickname]));
      const lastMessaged = lastMessagedByPhone(allMessages);
      const sorted = sortPhoneNumbers(numbers, phoneSort, lastMessaged);

      const allActive = !selectedPool ? ' active' : '';
      let html = `
        <li>
          <div class="card-item${allActive}" data-action="filter-all" role="button" tabindex="0">
            <div class="card-title">All messages</div>
            <div class="card-meta" style="margin-top:6px">Every pool number</div>
          </div>
        </li>
      `;

      if (!sorted.length) {
        phoneListEl.innerHTML = html + '<li class="empty">No numbers configured.</li>';
        return;
      }

      html += sorted.map((p) => {
        const last = lastMessaged.get(p.phoneNumber);
        return `
          <li>
            <div class="card-item${selectedPool === p.phoneNumber ? ' active' : ''}" data-phone="${escapeHtml(p.phoneNumber)}" role="button" tabindex="0">
              <div class="card-title" data-role="label">${escapeHtml(p.nickname)}</div>
              <div class="card-meta" style="margin-top:6px">${phoneCopyHtml(p.phoneNumber)}</div>
              <div class="card-preview">${last ? `Last messaged ${escapeHtml(fmtDate(last))}` : 'No messages yet'}</div>
              <div class="card-actions">
                <button class="btn btn-small btn-quiet" type="button" data-action="edit">Rename</button>
              </div>
            </div>
          </li>
        `;
      }).join('');

      phoneListEl.innerHTML = html;
    }

    function renderActivity() {
      const visible = filteredMessages(allMessages);
      activityTitle.textContent = selectedPool
        ? nicknameFor(selectedPool)
        : 'All messages';
      activitySubtitle.textContent = selectedPool
        ? `Messages sent to ${selectedPool}`
        : 'Messages across every pool number';
      newChatBar.hidden = !selectedPool;

      if (!visible.length) {
        activityWrap.innerHTML = selectedPool
          ? '<p class="empty">No messages to this number yet.</p>'
          : '<p class="empty">No messages yet.</p>';
        return;
      }

      activityWrap.innerHTML = `<ul class="stack">${visible.map((m) => {
        const remote = messageRemote(m);
        const pool = messagePool(m);
        const dir = messageDirection(m);
        const active = selectedPool === pool && selectedRemote === remote ? ' active' : '';
        const dest = !selectedPool ? ` · to ${escapeHtml(nicknameFor(pool))}` : '';
        return `
          <li>
            <div class="card-item msg-card${active}" data-action="open-chat" data-pool="${escapeHtml(pool)}" data-remote="${escapeHtml(remote)}" role="button" tabindex="0">
              <div class="msg-top">
                <div class="msg-from">${phoneCopyHtml(remote)}</div>
                <div class="msg-status">
                  <span class="pill${dir === 'outbound' ? ' out' : ''}">${dir === 'outbound' ? 'Sent' : 'Received'}</span>
                  <span class="msg-sub">${escapeHtml(fmtDate(m.receivedAt))}${dest}</span>
                </div>
              </div>
              <div class="msg-text">${escapeHtml(m.messageBody)}</div>
            </div>
          </li>
        `;
      }).join('')}</ul>`;
    }

    function renderChat() {
      if (!selectedPool || !selectedRemote) {
        chatPane.dataset.empty = 'true';
        chatHead.innerHTML = `
          <div>
            <div class="panel-kicker">Chat</div>
            <h2 class="panel-title">Conversation</h2>
            <p class="panel-subtitle">Select a message to reply</p>
          </div>
        `;
        chatWrap.innerHTML = '<div class="chat-empty-state">Select a message to open the chat.</div>';
        return;
      }

      chatPane.dataset.empty = 'false';
      const thread = threadMessages(selectedPool, selectedRemote, allMessages);
      chatHead.innerHTML = `
        <div>
          <div class="panel-kicker">Chat</div>
          <h2 class="panel-title">${phoneCopyHtml(selectedRemote)}</h2>
          <p class="panel-subtitle">via ${escapeHtml(nicknameFor(selectedPool))}</p>
        </div>
        <button class="btn btn-small btn-quiet" type="button" data-action="close-chat">Close</button>
      `;

      const bubbles = thread.length
        ? thread.map((m) => `
            <div class="bubble ${messageDirection(m) === 'outbound' ? 'out' : 'in'}">
              ${escapeHtml(m.messageBody)}
              <time>${escapeHtml(fmtDate(m.receivedAt))}</time>
            </div>
          `).join('')
        : '<div class="chat-empty-state" style="min-height:200px">No messages in this thread yet.</div>';

      chatWrap.innerHTML = `
        <div class="chat-messages" id="chat-messages">${bubbles}</div>
        <form class="compose" id="chat-compose-form">
          <textarea id="chat-compose-input" rows="1" placeholder="Type a reply…"></textarea>
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      `;

      const el = document.getElementById('chat-messages');
      if (el) el.scrollTop = el.scrollHeight;
    }

    function renderAll() {
      renderPhones(phoneNumbers);
      renderActivity();
      renderChat();
    }

    async function saveNickname(phoneNumber, nickname) {
      const res = await apiFetch('/api/phone-numbers/nickname', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber, nickname }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || 'Could not save nickname');
      }
      const { phoneNumber: updated } = await res.json();
      phoneNumbers = phoneNumbers.map((p) =>
        p.phoneNumber === updated.phoneNumber ? updated : p,
      );
      nicknameLookup.set(updated.phoneNumber, updated.nickname);
      renderAll();
      showToast(`Renamed to “${updated.nickname}”`);
    }

    async function sendChatMessage(messageBody) {
      if (!selectedPool || !selectedRemote) {
        showToast('Select a chat first');
        return;
      }
      const res = await apiFetch('/api/messages/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fromNumber: selectedPool,
          toNumber: selectedRemote,
          messageBody,
        }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || 'Failed to send');
      }
      const { message } = await res.json();
      allMessages = [message, ...allMessages];
      updateStatus(allMessages);
      renderAll();
      showToast('Message sent');
    }

    function showBanner(text) {
      const banner = document.getElementById('banner');
      document.getElementById('banner-text').textContent = text;
      banner.hidden = false;
    }

    async function refresh() {
      try {
        const health = await fetch('/api/health').then((r) => r.json());
        document.getElementById('logout-btn').hidden = !health.authRequired;

        if (!health.readerApiConfigured) {
          statusEl.textContent = 'Not configured';
          showBanner('Set READER_API_URL in .env to your deployed read API URL, then restart the dashboard.');
          return;
        }

        const [messagesRes, phonesRes] = await Promise.all([
          apiFetch('/api/messages'),
          apiFetch('/api/phone-numbers'),
        ]);
        if (!messagesRes.ok || !phonesRes.ok) {
          throw new Error('Could not load data from the read API');
        }

        const { messages } = await messagesRes.json();
        const { phoneNumbers: phones } = await phonesRes.json();

        if (selectedPool && !phones.some((p) => p.phoneNumber === selectedPool)) {
          selectedPool = null;
          selectedRemote = null;
        }

        allMessages = messages;
        phoneNumbers = phones;
        updateStatus(messages);
        renderAll();
      } catch (err) {
        statusEl.textContent = 'Error';
        showBanner(err.message || 'Failed to load');
        showToast(err.message || 'Failed to load');
      }
    }

    phoneListEl.addEventListener('click', async (event) => {
      if (event.target.closest('[data-action="copy-phone"]')) return;

      if (event.target.closest('[data-action="filter-all"]')) {
        selectedPool = null;
        selectedRemote = null;
        updateStatus(allMessages);
        renderAll();
        return;
      }

      const editBtn = event.target.closest('[data-action="edit"]');
      if (editBtn) {
        const item = editBtn.closest('[data-phone]');
        const phoneNumber = item?.dataset.phone;
        const current = phoneNumbers.find((p) => p.phoneNumber === phoneNumber);
        if (!current || !item) return;
        item.querySelector('[data-role="label"]').outerHTML = `
          <input class="phone-nickname-input" data-role="input" value="${escapeHtml(current.nickname)}" maxlength="64" />
        `;
        editBtn.outerHTML = `
          <button class="btn btn-primary btn-small" type="button" data-action="save">Save</button>
          <button class="btn btn-small btn-quiet" type="button" data-action="cancel">Cancel</button>
        `;
        item.querySelector('[data-role="input"]')?.focus();
        return;
      }

      const saveOrCancel = event.target.closest('[data-action="save"], [data-action="cancel"]');
      if (saveOrCancel) {
        const item = saveOrCancel.closest('[data-phone]');
        const phoneNumber = item?.dataset.phone;
        if (saveOrCancel.dataset.action === 'cancel') {
          renderPhones(phoneNumbers);
          return;
        }
        const input = item.querySelector('[data-role="input"]');
        const nickname = input?.value.trim();
        if (!nickname) {
          showToast('Nickname cannot be empty');
          return;
        }
        try {
          saveOrCancel.disabled = true;
          await saveNickname(phoneNumber, nickname);
        } catch (err) {
          showToast(err.message || 'Failed to save nickname');
          renderPhones(phoneNumbers);
        }
        return;
      }

      const item = event.target.closest('[data-phone]');
      if (!item) return;
      selectedPool = item.dataset.phone;
      selectedRemote = null;
      updateStatus(allMessages);
      renderAll();
    });

    activityWrap.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="copy-phone"]')) return;
      const btn = event.target.closest('[data-action="open-chat"]');
      if (!btn) return;
      selectedPool = btn.dataset.pool;
      selectedRemote = btn.dataset.remote;
      updateStatus(allMessages);
      renderAll();
    });

    newChatBar.addEventListener('click', (event) => {
      if (!event.target.closest('[data-action="start-chat"]')) return;
      const raw = document.getElementById('new-chat-number')?.value.trim() || '';
      const number = raw.replace(/[^\d+]/g, '');
      if (!number.startsWith('+') || number.length < 10) {
        showToast('Enter a full number like +1…');
        return;
      }
      selectedRemote = number;
      renderAll();
    });

    chatWrap.addEventListener('submit', async (event) => {
      const form = event.target.closest('#chat-compose-form');
      if (!form) return;
      event.preventDefault();
      const input = document.getElementById('chat-compose-input');
      const text = input?.value.trim();
      if (!text) return;
      const btn = form.querySelector('button[type="submit"]');
      try {
        if (btn) btn.disabled = true;
        await sendChatMessage(text);
        if (input) input.value = '';
      } catch (err) {
        showToast(err.message || 'Failed to send');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    chatHead.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="close-chat"]')) {
        selectedRemote = null;
        renderAll();
      }
    });

    document.addEventListener('click', async (event) => {
      const btn = event.target.closest('[data-action="copy-phone"]');
      if (!btn) return;
      event.preventDefault();
      event.stopPropagation();
      await copyPhoneNumber(btn.dataset.phone);
    });

    phoneSortEl?.addEventListener('change', () => {
      phoneSort = phoneSortEl.value;
      renderPhones(phoneNumbers);
    });

    document.getElementById('refresh-btn').addEventListener('click', refresh);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
