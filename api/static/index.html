<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS SMS — Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-cream-paper: #ffffeb;
      --color-midnight-ink: #1a1a1a;
      --color-white: #ffffff;
      --color-stone-mist: #e4e4d0;
      --color-graphite-veil: #8a8a80;
      --color-smoke: #5f5f59;
      --color-charcoal: #222222;
      --color-deep-forest-teal: #034f46;
      --color-lavender-whisper: #f0d7ff;
      --color-amber-pulse: #ffa946;
      --font-figtree: 'Figtree', ui-sans-serif, system-ui, sans-serif;
      --font-eb-garamond: 'EB Garamond', Georgia, serif;
      --text-caption: 14px;
      --leading-caption: 1.3;
      --text-body: 16px;
      --leading-body: 1.3;
      --text-subheading: 20px;
      --text-heading-sm: 24px;
      --radius-nav: 14px;
      --radius-cards: 32px;
      --radius-buttons: 14px;
      --radius-smallbadges: 8px;
      --page-max-width: 1200px;
      --card-padding: 32px;
      --nav-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-cream-paper);
      color: var(--color-midnight-ink);
      font-family: var(--font-figtree);
      font-weight: 400;
      font-size: var(--text-body);
      line-height: var(--leading-body);
      min-height: 100vh;
    }

    .nav-wrap {
      padding: var(--spacing-24, 24px) 50px 0;
      max-width: var(--page-max-width);
      margin: 0 auto;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-white);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-nav);
      padding: 10px 16px;
      box-shadow: var(--nav-shadow);
    }

    .wordmark {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .wordmark .muted { color: var(--color-graphite-veil); }
    .wordmark .accent { color: var(--color-midnight-ink); }

    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .nav-status {
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-smoke);
    }

    .btn {
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      font-weight: 600;
      line-height: 1;
      border-radius: var(--radius-buttons);
      padding: 10px 18px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--color-midnight-ink);
      color: var(--color-midnight-ink);
    }

    .btn-primary {
      background: var(--color-lavender-whisper);
      border: 1px solid var(--color-midnight-ink);
      color: var(--color-midnight-ink);
    }

    .banner {
      background: var(--color-deep-forest-teal);
      color: var(--color-white);
      padding: 14px 24px;
      text-align: center;
      font-size: var(--text-caption);
      font-weight: 500;
      margin-top: 24px;
    }

    .banner[hidden] { display: none; }

    .hero {
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: 64px 50px 48px;
      text-align: center;
    }

    .hero h1 {
      font-family: var(--font-eb-garamond);
      font-weight: 400;
      font-size: clamp(48px, 8vw, 72px);
      line-height: 0.95;
      letter-spacing: -0.05em;
      font-feature-settings: "liga" on, "dlig" on;
    }

    .hero h1 .muted { color: var(--color-graphite-veil); }
    .hero h1 .accent { color: var(--color-midnight-ink); }

    .hero p {
      margin-top: 20px;
      color: var(--color-midnight-ink);
      font-size: 18px;
      max-width: 52ch;
      margin-left: auto;
      margin-right: auto;
    }

    .layout {
      max-width: var(--page-max-width);
      margin: 0 auto;
      padding: 0 50px 80px;
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 32px;
    }

    @media (max-width: 800px) {
      .layout { grid-template-columns: 1fr; }
      .nav-wrap, .hero, .layout { padding-left: 20px; padding-right: 20px; }
    }

    .card {
      background: var(--color-white);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-cards);
      padding: var(--card-padding);
    }

    .badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-white);
      background: var(--color-deep-forest-teal);
      border-radius: 1000px;
      padding: 6px 14px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: var(--text-subheading);
      font-weight: 600;
      line-height: 1;
      margin-bottom: 20px;
    }

    .phone-sort {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }

    .phone-sort label {
      font-size: 12px;
      font-weight: 500;
      color: var(--color-smoke);
    }

    .phone-sort select {
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-midnight-ink);
      background: var(--color-cream-paper);
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-smallbadges);
      padding: 8px 10px;
      width: 100%;
      cursor: pointer;
    }

    .phone-list {
      list-style: none;
      display: grid;
      gap: 12px;
    }

    .phone-item {
      padding: 16px;
      border-radius: var(--radius-nav);
      border: 1px solid var(--color-stone-mist);
      background: var(--color-cream-paper);
      font-size: var(--text-body);
      font-weight: 500;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .phone-item:hover {
      border-color: var(--color-graphite-veil);
    }

    .phone-item.filter-active {
      border-color: var(--color-deep-forest-teal);
      background: var(--color-white);
      box-shadow: inset 0 0 0 1px var(--color-deep-forest-teal);
    }

    .phone-item.filter-all .phone-nickname {
      color: var(--color-deep-forest-teal);
    }

    .phone-nickname {
      font-size: var(--text-body);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .phone-nickname-input {
      width: 100%;
      font-family: var(--font-figtree);
      font-size: var(--text-body);
      font-weight: 600;
      border: 1px solid var(--color-stone-mist);
      border-radius: var(--radius-smallbadges);
      padding: 8px 10px;
      background: var(--color-white);
      color: var(--color-midnight-ink);
    }

    .phone-actions {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }

    .btn-small {
      font-size: 12px;
      padding: 6px 12px;
    }

    .phone-meta {
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-smoke);
      margin-top: 6px;
    }

    .phone-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .phone-copy .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 22px;
      height: 22px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--color-graphite-veil);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
      flex-shrink: 0;
    }

    .phone-copy:hover .copy-btn,
    .phone-copy .copy-btn:focus {
      opacity: 1;
    }

    .phone-copy .copy-btn:hover {
      color: var(--color-midnight-ink);
      background: var(--color-stone-mist);
    }

    .phone-copy .copy-btn svg {
      width: 14px;
      height: 14px;
    }

    .messages-table {
      width: 100%;
      border-collapse: collapse;
      font-size: var(--text-caption);
    }

    .messages-table th {
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      color: var(--color-smoke);
      padding: 0 12px 14px 0;
    }

    .messages-table td {
      padding: 16px 12px 16px 0;
      border-top: 1px solid var(--color-stone-mist);
      vertical-align: top;
    }

    .message-body { max-width: 360px; word-break: break-word; }

    .filter-label {
      font-size: var(--text-caption);
      font-weight: 500;
      color: var(--color-smoke);
      margin-bottom: 16px;
    }

    .filter-label strong {
      color: var(--color-midnight-ink);
      font-weight: 600;
    }

    .empty {
      color: var(--color-smoke);
      font-size: var(--text-caption);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--color-midnight-ink);
      color: var(--color-white);
      padding: 14px 20px;
      border-radius: var(--radius-buttons);
      font-size: var(--text-caption);
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
    }

    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="nav-wrap">
    <header class="nav">
      <div class="wordmark"><span class="muted">AWS</span><span class="accent">SMS</span></div>
      <div class="nav-actions">
        <div class="nav-status" id="status">Loading…</div>
        <button class="btn btn-ghost" type="button" id="refresh-btn">Refresh</button>
        <button class="btn btn-ghost" type="button" id="logout-btn" hidden>Sign out</button>
      </div>
    </header>
  </div>

  <div class="banner" id="banner" hidden>
    <span id="banner-text"></span>
  </div>

  <section class="hero">
    <h1><span class="muted">Inbound</span> <span class="accent">messages</span></h1>
    <p>Read-only view of SMS received on your pool numbers. Data comes from the message store — no AWS login required on this server.</p>
  </section>

  <main class="layout">
    <aside class="card">
      <div class="badge">Numbers</div>
      <h2>Phone pool</h2>
      <div class="phone-sort">
        <label for="phone-sort">Sort by</label>
        <select id="phone-sort">
          <option value="date-added" selected>Date added</option>
          <option value="last-messaged">Last messaged</option>
        </select>
      </div>
      <ul class="phone-list" id="phone-list">
        <li class="empty">Loading…</li>
      </ul>
    </aside>

    <section class="card">
      <div class="badge">Inbox</div>
      <h2>Messages</h2>
      <div id="messages-wrap"><p class="empty">Loading…</p></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const phoneListEl = document.getElementById('phone-list');
    const phoneSortEl = document.getElementById('phone-sort');
    const messagesWrap = document.getElementById('messages-wrap');
    const toast = document.getElementById('toast');
    let phoneNumbers = [];
    let nicknameLookup = new Map();
    let regionLookup = new Map();
    let selectedFilter = null;
    let allMessages = [];
    let phoneSort = phoneSortEl?.value || 'date-added';

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/login.html';
        throw new Error('Sign in required');
      }
      return res;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.className = 'toast show';
      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const COPY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

    function phoneCopyHtml(phoneNumber) {
      return `<span class="phone-copy"><span>${escapeHtml(phoneNumber)}</span><button class="copy-btn" type="button" data-action="copy-phone" data-phone="${escapeHtml(phoneNumber)}" title="Copy phone number" aria-label="Copy phone number">${COPY_ICON}</button></span>`;
    }

    async function copyPhoneNumber(phoneNumber) {
      try {
        await navigator.clipboard.writeText(phoneNumber);
        showToast(`Copied ${phoneNumber}`);
      } catch {
        showToast('Could not copy');
      }
    }

    function fmtDate(iso) {
      try { return new Date(iso).toLocaleString(); } catch { return iso; }
    }

    function nicknameFor(number) {
      return nicknameLookup.get(number) ?? number;
    }

    function regionFor(number) {
      return regionLookup.get(number) ?? '';
    }

    function filterLabel() {
      if (!selectedFilter) return 'Showing <strong>all messages</strong>';
      const nickname = nicknameFor(selectedFilter);
      return `Showing messages to <strong>${escapeHtml(nickname)}</strong>`;
    }

    function filteredMessages(messages) {
      if (!selectedFilter) return messages;
      return messages.filter((m) => m.toNumber === selectedFilter);
    }

    function updateStatus(messages) {
      const visible = filteredMessages(messages);
      if (selectedFilter) {
        statusEl.textContent = `${visible.length} of ${messages.length} message${messages.length === 1 ? '' : 's'}`;
      } else {
        statusEl.textContent = `${messages.length} message${messages.length === 1 ? '' : 's'}`;
      }
    }

    function lastMessagedByPhone(messages) {
      const map = new Map();
      for (const m of messages) {
        const current = map.get(m.toNumber);
        if (!current || m.receivedAt > current) {
          map.set(m.toNumber, m.receivedAt);
        }
      }
      return map;
    }

    function sortPhoneNumbers(numbers, sortMode, lastMessaged) {
      return [...numbers].sort((a, b) => {
        if (sortMode === 'last-messaged') {
          const aTs = lastMessaged.get(a.phoneNumber) ?? '';
          const bTs = lastMessaged.get(b.phoneNumber) ?? '';
          if (aTs === bTs) return a.phoneNumber.localeCompare(b.phoneNumber);
          if (!aTs) return 1;
          if (!bTs) return -1;
          return bTs.localeCompare(aTs);
        }
        const aTs = a.createdAt ?? '';
        const bTs = b.createdAt ?? '';
        if (aTs === bTs) return a.phoneNumber.localeCompare(b.phoneNumber);
        if (!aTs) return 1;
        if (!bTs) return -1;
        return bTs.localeCompare(aTs);
      });
    }

    function renderPhones(numbers) {
      phoneNumbers = numbers;
      nicknameLookup = new Map(numbers.map((p) => [p.phoneNumber, p.nickname]));
      regionLookup = new Map(numbers.map((p) => [p.phoneNumber, p.region]));
      const lastMessaged = lastMessagedByPhone(allMessages);
      const sorted = sortPhoneNumbers(numbers, phoneSort, lastMessaged);
      const allActive = !selectedFilter ? ' filter-active' : '';
      const allItem = `
        <li class="phone-item filter-all${allActive}" data-action="filter-all">
          <div class="phone-nickname">All messages</div>
          <div class="phone-meta">Every pool number</div>
        </li>
      `;
      if (!sorted.length) {
        phoneListEl.innerHTML = allItem + '<li class="empty">No numbers configured.</li>';
        return;
      }
      phoneListEl.innerHTML = allItem + sorted.map((p) => {
        const last = lastMessaged.get(p.phoneNumber);
        const addedLabel = p.createdAt ? fmtDate(p.createdAt) : 'Unknown';
        const lastLabel = last ? fmtDate(last) : 'Never';
        return `
        <li class="phone-item${selectedFilter === p.phoneNumber ? ' filter-active' : ''}" data-phone="${escapeHtml(p.phoneNumber)}">
          <div class="phone-nickname" data-role="label">${escapeHtml(p.nickname)}</div>
          <div class="phone-meta">${phoneCopyHtml(p.phoneNumber)}</div>
          <div class="phone-meta">${escapeHtml(p.region)}</div>
          <div class="phone-meta">Added ${escapeHtml(addedLabel)}</div>
          <div class="phone-meta">Last messaged ${escapeHtml(lastLabel)}</div>
          <div class="phone-actions">
            <button class="btn btn-ghost btn-small" type="button" data-action="edit">Rename</button>
          </div>
        </li>
      `;
      }).join('');
    }

    async function saveNickname(phoneNumber, nickname) {
      const res = await apiFetch('/api/phone-numbers/nickname', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber, nickname }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || 'Could not save nickname');
      }
      const { phoneNumber: updated } = await res.json();
      phoneNumbers = phoneNumbers.map((p) =>
        p.phoneNumber === updated.phoneNumber ? updated : p,
      );
      nicknameLookup.set(updated.phoneNumber, updated.nickname);
      if (updated.region) regionLookup.set(updated.phoneNumber, updated.region);
      renderPhones(phoneNumbers);
      renderMessages(allMessages);
      showToast(`Renamed to “${updated.nickname}”`);
    }

    phoneListEl.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="edit"], [data-action="save"], [data-action="cancel"], [data-role="input"], [data-action="copy-phone"]')) {
        return;
      }
      if (event.target.closest('[data-action="filter-all"]')) {
        selectedFilter = null;
        renderPhones(phoneNumbers);
        renderMessages(allMessages);
        updateStatus(allMessages);
        return;
      }
      const item = event.target.closest('.phone-item[data-phone]');
      if (!item) return;
      selectedFilter = item.dataset.phone;
      renderPhones(phoneNumbers);
      renderMessages(allMessages);
      updateStatus(allMessages);
    });

    phoneListEl.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-action="edit"]');
      if (!button) return;
      const item = button.closest('.phone-item');
      const phoneNumber = item?.dataset.phone;
      const current = phoneNumbers.find((p) => p.phoneNumber === phoneNumber);
      if (!current) return;

      item.querySelector('[data-role="label"]').outerHTML = `
        <input class="phone-nickname-input" data-role="input" value="${escapeHtml(current.nickname)}" maxlength="64" />
      `;
      button.outerHTML = `
        <button class="btn btn-primary btn-small" type="button" data-action="save">Save</button>
        <button class="btn btn-ghost btn-small" type="button" data-action="cancel">Cancel</button>
      `;
      item.querySelector('[data-role="input"]')?.focus();
    });

    phoneListEl.addEventListener('click', async (event) => {
      const button = event.target.closest('[data-action="save"], [data-action="cancel"]');
      if (!button) return;
      const item = button.closest('.phone-item');
      const phoneNumber = item?.dataset.phone;
      if (button.dataset.action === 'cancel') {
        renderPhones(phoneNumbers);
        return;
      }
      const input = item.querySelector('[data-role="input"]');
      const nickname = input?.value.trim();
      if (!nickname) {
        showToast('Nickname cannot be empty');
        return;
      }
      try {
        button.disabled = true;
        await saveNickname(phoneNumber, nickname);
      } catch (err) {
        showToast(err.message || 'Failed to save nickname');
        renderPhones(phoneNumbers);
      }
    });

    function renderMessages(messages) {
      allMessages = messages;
      renderPhones(phoneNumbers);
      const visible = filteredMessages(messages);
      const filterHtml = `<p class="filter-label">${filterLabel()}</p>`;

      if (!messages.length) {
        messagesWrap.innerHTML = filterHtml + '<p class="empty">No messages yet. Text one of your pool numbers to create an entry.</p>';
        return;
      }
      if (!visible.length) {
        messagesWrap.innerHTML = filterHtml + '<p class="empty">No messages for this number yet.</p>';
        return;
      }
      messagesWrap.innerHTML = filterHtml + `
        <table class="messages-table">
          <thead>
            <tr>
              <th>Received</th>
              <th>From</th>
              <th>To</th>
              <th>Message</th>
            </tr>
          </thead>
          <tbody>
            ${visible.map((m) => `
              <tr>
                <td>${fmtDate(m.receivedAt)}</td>
                <td>${phoneCopyHtml(m.fromNumber)}</td>
                <td>${escapeHtml(nicknameFor(m.toNumber))}<div class="phone-meta">${phoneCopyHtml(m.toNumber)}</div><div class="phone-meta">${escapeHtml(regionFor(m.toNumber))}</div></td>
                <td class="message-body">${escapeHtml(m.messageBody)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `;
    }

    function showBanner(text) {
      const banner = document.getElementById('banner');
      const inner = document.getElementById('banner-text');
      banner.hidden = false;
      inner.textContent = text;
    }

    async function refresh() {
      try {
        const health = await fetch('/api/health').then((r) => r.json());
        document.getElementById('logout-btn').hidden = !health.authRequired;

        if (!health.readerApiConfigured) {
          statusEl.textContent = 'Not configured';
          showBanner('Set READER_API_URL in .env to your deployed read API URL, then restart the dashboard.');
          return;
        }

        const [messagesRes, phonesRes] = await Promise.all([
          apiFetch('/api/messages'),
          apiFetch('/api/phone-numbers'),
        ]);

        if (!messagesRes.ok || !phonesRes.ok) {
          throw new Error('Could not load data from the read API');
        }

        const { messages } = await messagesRes.json();
        const { phoneNumbers } = await phonesRes.json();

        if (selectedFilter && !phoneNumbers.some((p) => p.phoneNumber === selectedFilter)) {
          selectedFilter = null;
        }

        updateStatus(messages);
        renderPhones(phoneNumbers);
        renderMessages(messages);
      } catch (err) {
        statusEl.textContent = 'Error';
        showBanner(err.message || 'Failed to load');
        showToast(err.message || 'Failed to load');
      }
    }

    document.addEventListener('click', async (event) => {
      const btn = event.target.closest('[data-action="copy-phone"]');
      if (!btn) return;
      event.preventDefault();
      event.stopPropagation();
      await copyPhoneNumber(btn.dataset.phone);
    });

    phoneSortEl?.addEventListener('change', () => {
      phoneSort = phoneSortEl.value;
      renderPhones(phoneNumbers);
    });

    document.getElementById('refresh-btn').addEventListener('click', refresh);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
