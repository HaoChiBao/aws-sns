<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AWS SMS — Inbox</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-cream-paper: #ffffeb;
      --color-midnight-ink: #1a1a1a;
      --color-white: #ffffff;
      --color-stone-mist: #e4e4d0;
      --color-graphite-veil: #8a8a80;
      --color-smoke: #5f5f59;
      --color-deep-forest-teal: #034f46;
      --color-lavender-whisper: #f0d7ff;
      --font-figtree: 'Figtree', ui-sans-serif, system-ui, sans-serif;
      --font-eb-garamond: 'EB Garamond', Georgia, serif;
      --text-caption: 13px;
      --text-body: 15px;
      --radius: 12px;
      --border: 1px solid var(--color-stone-mist);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--color-cream-paper);
      color: var(--color-midnight-ink);
      font-family: var(--font-figtree);
      font-size: var(--text-body);
      line-height: 1.4;
      min-height: 100vh;
    }

    .app {
      max-width: 1280px;
      margin: 0 auto;
      padding: 20px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      min-height: 100vh;
    }

    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--color-white);
      border: var(--border);
      border-radius: var(--radius);
      padding: 10px 14px;
    }

    .wordmark {
      font-size: 15px;
      font-weight: 600;
    }
    .wordmark .muted { color: var(--color-graphite-veil); }

    .nav-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .nav-status {
      font-size: var(--text-caption);
      color: var(--color-smoke);
      font-weight: 500;
    }

    .btn {
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      font-weight: 600;
      border-radius: 10px;
      padding: 8px 14px;
      cursor: pointer;
      border: 1px solid var(--color-midnight-ink);
      background: transparent;
      color: var(--color-midnight-ink);
    }
    .btn:hover { opacity: 0.85; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary {
      background: var(--color-lavender-whisper);
    }
    .btn-small { padding: 6px 10px; font-size: 12px; }
    .btn-ghost-soft {
      border-color: transparent;
      color: var(--color-smoke);
      padding: 4px 8px;
    }

    .banner {
      background: var(--color-deep-forest-teal);
      color: var(--color-white);
      padding: 12px 16px;
      text-align: center;
      font-size: var(--text-caption);
      font-weight: 500;
      border-radius: var(--radius);
    }
    .banner[hidden] { display: none; }

    .shell {
      flex: 1;
      display: grid;
      grid-template-columns: 240px minmax(280px, 1fr) minmax(300px, 1.1fr);
      gap: 0;
      min-height: calc(100vh - 120px);
      background: var(--color-white);
      border: var(--border);
      border-radius: 16px;
      overflow: hidden;
    }

    @media (max-width: 960px) {
      .shell {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      .pane-chat[data-empty="true"] { display: none; }
    }

    .pane {
      display: flex;
      flex-direction: column;
      min-height: 0;
      border-right: var(--border);
    }
    .pane:last-child { border-right: none; }

    .pane-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 14px 16px;
      border-bottom: var(--border);
      min-height: 52px;
    }

    .pane-head h2 {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--color-smoke);
    }

    .pane-head .title {
      font-size: 15px;
      font-weight: 600;
      color: var(--color-midnight-ink);
      text-transform: none;
      letter-spacing: 0;
    }

    .pane-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
    }

    .phone-sort {
      padding: 10px 16px;
      border-bottom: var(--border);
    }
    .phone-sort select {
      width: 100%;
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      border: var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      background: var(--color-cream-paper);
      color: var(--color-midnight-ink);
    }

    .list { list-style: none; }

    .row {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      border-bottom: var(--border);
      padding: 12px 16px;
      cursor: pointer;
      font-family: var(--font-figtree);
      color: inherit;
      display: block;
    }
    .row:hover { background: var(--color-cream-paper); }
    .row.active {
      background: var(--color-cream-paper);
      box-shadow: inset 3px 0 0 var(--color-deep-forest-teal);
    }

    .row-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .row-meta {
      font-size: 12px;
      color: var(--color-smoke);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }
    .row-preview {
      font-size: 12px;
      color: var(--color-graphite-veil);
      margin-top: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .phone-row-actions {
      margin-top: 8px;
    }

    .phone-nickname-input {
      width: 100%;
      font-family: var(--font-figtree);
      font-size: 14px;
      font-weight: 600;
      border: var(--border);
      border-radius: 8px;
      padding: 6px 8px;
      background: var(--color-white);
    }

    .phone-copy {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .phone-copy .copy-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 18px;
      height: 18px;
      padding: 0;
      border: none;
      background: transparent;
      color: var(--color-graphite-veil);
      border-radius: 4px;
      cursor: pointer;
      opacity: 0;
    }
    .phone-copy:hover .copy-btn,
    .phone-copy .copy-btn:focus { opacity: 1; }
    .phone-copy .copy-btn svg { width: 12px; height: 12px; }

    .activity-item .from {
      font-weight: 600;
      font-size: 14px;
    }
    .activity-item .body {
      margin-top: 4px;
      font-size: 13px;
      color: var(--color-midnight-ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .dir-pill {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--color-deep-forest-teal);
      background: rgba(3, 79, 70, 0.08);
      padding: 2px 6px;
      border-radius: 999px;
    }
    .dir-pill.out {
      color: var(--color-smoke);
      background: var(--color-stone-mist);
    }

    .empty {
      padding: 24px 16px;
      color: var(--color-smoke);
      font-size: var(--text-caption);
    }

    .chat-empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
      text-align: center;
      color: var(--color-smoke);
      font-size: var(--text-caption);
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--color-cream-paper);
    }

    .bubble {
      max-width: 80%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.35;
      word-break: break-word;
    }
    .bubble.in {
      align-self: flex-start;
      background: var(--color-white);
      border: var(--border);
    }
    .bubble.out {
      align-self: flex-end;
      background: var(--color-deep-forest-teal);
      color: var(--color-white);
    }
    .bubble time {
      display: block;
      margin-top: 4px;
      font-size: 11px;
      opacity: 0.65;
    }

    .compose {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: var(--border);
      background: var(--color-white);
    }
    .compose textarea {
      flex: 1;
      font-family: var(--font-figtree);
      font-size: 14px;
      border: var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      resize: none;
      min-height: 42px;
      max-height: 100px;
    }

    .new-chat {
      display: flex;
      gap: 6px;
      padding: 10px 16px;
      border-bottom: var(--border);
    }
    .new-chat input {
      flex: 1;
      font-family: var(--font-figtree);
      font-size: var(--text-caption);
      border: var(--border);
      border-radius: 8px;
      padding: 7px 10px;
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--color-midnight-ink);
      color: var(--color-white);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: var(--text-caption);
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 20;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header class="nav">
      <div class="wordmark"><span class="muted">AWS</span> SMS</div>
      <div class="nav-actions">
        <div class="nav-status" id="status">Loading…</div>
        <button class="btn" type="button" id="refresh-btn">Refresh</button>
        <button class="btn" type="button" id="logout-btn" hidden>Sign out</button>
      </div>
    </header>

    <div class="banner" id="banner" hidden>
      <span id="banner-text"></span>
    </div>

    <div class="shell">
      <aside class="pane pane-numbers">
        <div class="pane-head">
          <h2>Numbers</h2>
        </div>
        <div class="phone-sort">
          <select id="phone-sort" aria-label="Sort phone numbers">
            <option value="date-added" selected>Date added</option>
            <option value="last-messaged">Last messaged</option>
          </select>
        </div>
        <div class="pane-body">
          <ul class="list" id="phone-list">
            <li class="empty">Loading…</li>
          </ul>
        </div>
      </aside>

      <section class="pane pane-activity">
        <div class="pane-head">
          <h2 class="title" id="activity-title">All messages</h2>
        </div>
        <div class="new-chat" id="new-chat-bar" hidden>
          <input id="new-chat-number" type="tel" placeholder="Start chat: +1…" aria-label="New chat number" />
          <button class="btn btn-small" type="button" data-action="start-chat">Open</button>
        </div>
        <div class="pane-body" id="activity-wrap">
          <p class="empty">Loading…</p>
        </div>
      </section>

      <section class="pane pane-chat" id="chat-pane" data-empty="true">
        <div class="pane-head" id="chat-head">
          <h2 class="title">Conversation</h2>
        </div>
        <div class="pane-body" id="chat-wrap" style="display:flex;flex-direction:column">
          <div class="chat-empty">Select a message to open the chat.</div>
        </div>
      </section>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    const statusEl = document.getElementById('status');
    const phoneListEl = document.getElementById('phone-list');
    const phoneSortEl = document.getElementById('phone-sort');
    const activityWrap = document.getElementById('activity-wrap');
    const activityTitle = document.getElementById('activity-title');
    const newChatBar = document.getElementById('new-chat-bar');
    const chatPane = document.getElementById('chat-pane');
    const chatHead = document.getElementById('chat-head');
    const chatWrap = document.getElementById('chat-wrap');
    const toast = document.getElementById('toast');

    let phoneNumbers = [];
    let nicknameLookup = new Map();
    let selectedPool = null;
    let selectedRemote = null;
    let allMessages = [];
    let phoneSort = phoneSortEl?.value || 'date-added';

    function messagePool(m) {
      return m.poolNumber || (m.direction === 'outbound' ? m.fromNumber : m.toNumber);
    }
    function messageRemote(m) {
      return m.remoteNumber || (m.direction === 'outbound' ? m.toNumber : m.fromNumber);
    }
    function messageDirection(m) {
      return m.direction === 'outbound' ? 'outbound' : 'inbound';
    }

    async function apiFetch(url, options) {
      const res = await fetch(url, options);
      if (res.status === 401) {
        window.location.href = '/login.html';
        throw new Error('Sign in required');
      }
      return res;
    }

    function showToast(msg) {
      toast.textContent = msg;
      toast.className = 'toast show';
      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    const COPY_ICON = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

    function phoneCopyHtml(phoneNumber) {
      return `<span class="phone-copy"><span>${escapeHtml(phoneNumber)}</span><button class="copy-btn" type="button" data-action="copy-phone" data-phone="${escapeHtml(phoneNumber)}" title="Copy" aria-label="Copy phone number">${COPY_ICON}</button></span>`;
    }

    async function copyPhoneNumber(phoneNumber) {
      try {
        await navigator.clipboard.writeText(phoneNumber);
        showToast(`Copied ${phoneNumber}`);
      } catch {
        showToast('Could not copy');
      }
    }

    function fmtDate(iso) {
      try {
        const d = new Date(iso);
        const now = new Date();
        const sameDay = d.toDateString() === now.toDateString();
        if (sameDay) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        return d.toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
      } catch {
        return iso;
      }
    }

    function nicknameFor(number) {
      return nicknameLookup.get(number) ?? number;
    }

    function filteredMessages(messages) {
      if (!selectedPool) return messages;
      return messages.filter((m) => messagePool(m) === selectedPool);
    }

    function updateStatus(messages) {
      const visible = filteredMessages(messages);
      if (selectedPool) {
        statusEl.textContent = `${visible.length} of ${messages.length}`;
      } else {
        statusEl.textContent = `${messages.length} message${messages.length === 1 ? '' : 's'}`;
      }
    }

    function lastMessagedByPhone(messages) {
      const map = new Map();
      for (const m of messages) {
        const pool = messagePool(m);
        const current = map.get(pool);
        if (!current || m.receivedAt > current) map.set(pool, m.receivedAt);
      }
      return map;
    }

    function threadMessages(poolNumber, remoteNumber, messages) {
      return messages
        .filter((m) => messagePool(m) === poolNumber && messageRemote(m) === remoteNumber)
        .sort((a, b) => a.receivedAt.localeCompare(b.receivedAt));
    }

    function sortPhoneNumbers(numbers, sortMode, lastMessaged) {
      return [...numbers].sort((a, b) => {
        if (sortMode === 'last-messaged') {
          const aTs = lastMessaged.get(a.phoneNumber) ?? '';
          const bTs = lastMessaged.get(b.phoneNumber) ?? '';
          if (aTs === bTs) return a.phoneNumber.localeCompare(b.phoneNumber);
          if (!aTs) return 1;
          if (!bTs) return -1;
          return bTs.localeCompare(aTs);
        }
        const aTs = a.createdAt ?? '';
        const bTs = b.createdAt ?? '';
        if (aTs === bTs) return a.phoneNumber.localeCompare(b.phoneNumber);
        if (!aTs) return 1;
        if (!bTs) return -1;
        return bTs.localeCompare(aTs);
      });
    }

    function renderPhones(numbers) {
      phoneNumbers = numbers;
      nicknameLookup = new Map(numbers.map((p) => [p.phoneNumber, p.nickname]));
      const lastMessaged = lastMessagedByPhone(allMessages);
      const sorted = sortPhoneNumbers(numbers, phoneSort, lastMessaged);

      const allActive = !selectedPool ? ' active' : '';
      let html = `
        <li>
          <button type="button" class="row${allActive}" data-action="filter-all">
            <div class="row-title">All messages</div>
            <div class="row-meta">Entire pool</div>
          </button>
        </li>
      `;

      if (!sorted.length) {
        phoneListEl.innerHTML = html + '<li class="empty">No numbers configured.</li>';
        return;
      }

      html += sorted.map((p) => {
        const last = lastMessaged.get(p.phoneNumber);
        return `
          <li>
            <div class="row${selectedPool === p.phoneNumber ? ' active' : ''}" data-phone="${escapeHtml(p.phoneNumber)}" role="button" tabindex="0">
              <div class="row-title" data-role="label">${escapeHtml(p.nickname)}</div>
              <div class="row-meta">${phoneCopyHtml(p.phoneNumber)}</div>
              <div class="row-preview">${last ? `Last ${escapeHtml(fmtDate(last))}` : 'No messages yet'}</div>
              <div class="phone-row-actions">
                <button class="btn btn-small btn-ghost-soft" type="button" data-action="edit">Rename</button>
              </div>
            </div>
          </li>
        `;
      }).join('');

      phoneListEl.innerHTML = html;
    }

    function renderActivity() {
      const visible = filteredMessages(allMessages);
      activityTitle.textContent = selectedPool
        ? nicknameFor(selectedPool)
        : 'All messages';
      newChatBar.hidden = !selectedPool;

      if (!visible.length) {
        activityWrap.innerHTML = selectedPool
          ? '<p class="empty">No messages to this number yet.</p>'
          : '<p class="empty">No messages yet.</p>';
        return;
      }

      activityWrap.innerHTML = `<ul class="list">${visible.map((m) => {
        const remote = messageRemote(m);
        const pool = messagePool(m);
        const dir = messageDirection(m);
        const active = selectedPool === pool && selectedRemote === remote ? ' active' : '';
        return `
          <li>
            <button type="button" class="row activity-item${active}" data-action="open-chat" data-pool="${escapeHtml(pool)}" data-remote="${escapeHtml(remote)}">
              <div class="row-meta">
                <span class="from">${phoneCopyHtml(remote)}</span>
                <span class="dir-pill${dir === 'outbound' ? ' out' : ''}">${dir === 'outbound' ? 'Sent' : 'Received'}</span>
                <span>${escapeHtml(fmtDate(m.receivedAt))}</span>
              </div>
              ${!selectedPool ? `<div class="row-preview">to ${escapeHtml(nicknameFor(pool))}</div>` : ''}
              <div class="body">${escapeHtml(m.messageBody)}</div>
            </button>
          </li>
        `;
      }).join('')}</ul>`;
    }

    function renderChat() {
      if (!selectedPool || !selectedRemote) {
        chatPane.dataset.empty = 'true';
        chatHead.innerHTML = '<h2 class="title">Conversation</h2>';
        chatWrap.innerHTML = '<div class="chat-empty">Select a message to open the chat.</div>';
        return;
      }

      chatPane.dataset.empty = 'false';
      const thread = threadMessages(selectedPool, selectedRemote, allMessages);
      chatHead.innerHTML = `
        <div>
          <h2 class="title">${phoneCopyHtml(selectedRemote)}</h2>
          <div class="row-meta" style="margin-top:2px">via ${escapeHtml(nicknameFor(selectedPool))}</div>
        </div>
        <button class="btn btn-small btn-ghost-soft" type="button" data-action="close-chat">Close</button>
      `;

      const bubbles = thread.length
        ? thread.map((m) => `
            <div class="bubble ${messageDirection(m) === 'outbound' ? 'out' : 'in'}">
              ${escapeHtml(m.messageBody)}
              <time>${escapeHtml(fmtDate(m.receivedAt))}</time>
            </div>
          `).join('')
        : '<div class="chat-empty" style="padding:16px">No messages in this thread yet.</div>';

      chatWrap.innerHTML = `
        <div class="chat-messages" id="chat-messages">${bubbles}</div>
        <form class="compose" id="chat-compose-form">
          <textarea id="chat-compose-input" rows="1" placeholder="Reply…"></textarea>
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
      `;

      const el = document.getElementById('chat-messages');
      if (el) el.scrollTop = el.scrollHeight;
    }

    function renderAll() {
      renderPhones(phoneNumbers);
      renderActivity();
      renderChat();
    }

    async function saveNickname(phoneNumber, nickname) {
      const res = await apiFetch('/api/phone-numbers/nickname', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ phoneNumber, nickname }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || 'Could not save nickname');
      }
      const { phoneNumber: updated } = await res.json();
      phoneNumbers = phoneNumbers.map((p) =>
        p.phoneNumber === updated.phoneNumber ? updated : p,
      );
      nicknameLookup.set(updated.phoneNumber, updated.nickname);
      renderAll();
      showToast(`Renamed to “${updated.nickname}”`);
    }

    async function sendChatMessage(messageBody) {
      if (!selectedPool || !selectedRemote) {
        showToast('Select a chat first');
        return;
      }
      const res = await apiFetch('/api/messages/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          fromNumber: selectedPool,
          toNumber: selectedRemote,
          messageBody,
        }),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.error || 'Failed to send');
      }
      const { message } = await res.json();
      allMessages = [message, ...allMessages];
      updateStatus(allMessages);
      renderAll();
      showToast('Message sent');
    }

    function showBanner(text) {
      const banner = document.getElementById('banner');
      document.getElementById('banner-text').textContent = text;
      banner.hidden = false;
    }

    async function refresh() {
      try {
        const health = await fetch('/api/health').then((r) => r.json());
        document.getElementById('logout-btn').hidden = !health.authRequired;

        if (!health.readerApiConfigured) {
          statusEl.textContent = 'Not configured';
          showBanner('Set READER_API_URL in .env to your deployed read API URL, then restart the dashboard.');
          return;
        }

        const [messagesRes, phonesRes] = await Promise.all([
          apiFetch('/api/messages'),
          apiFetch('/api/phone-numbers'),
        ]);
        if (!messagesRes.ok || !phonesRes.ok) {
          throw new Error('Could not load data from the read API');
        }

        const { messages } = await messagesRes.json();
        const { phoneNumbers: phones } = await phonesRes.json();

        if (selectedPool && !phones.some((p) => p.phoneNumber === selectedPool)) {
          selectedPool = null;
          selectedRemote = null;
        }

        allMessages = messages;
        phoneNumbers = phones;
        updateStatus(messages);
        renderAll();
      } catch (err) {
        statusEl.textContent = 'Error';
        showBanner(err.message || 'Failed to load');
        showToast(err.message || 'Failed to load');
      }
    }

    phoneListEl.addEventListener('click', async (event) => {
      if (event.target.closest('[data-action="copy-phone"]')) return;

      if (event.target.closest('[data-action="filter-all"]')) {
        selectedPool = null;
        selectedRemote = null;
        updateStatus(allMessages);
        renderAll();
        return;
      }

      const editBtn = event.target.closest('[data-action="edit"]');
      if (editBtn) {
        const item = editBtn.closest('[data-phone]');
        const phoneNumber = item?.dataset.phone;
        const current = phoneNumbers.find((p) => p.phoneNumber === phoneNumber);
        if (!current || !item) return;
        item.querySelector('[data-role="label"]').outerHTML = `
          <input class="phone-nickname-input" data-role="input" value="${escapeHtml(current.nickname)}" maxlength="64" />
        `;
        editBtn.outerHTML = `
          <button class="btn btn-primary btn-small" type="button" data-action="save">Save</button>
          <button class="btn btn-small" type="button" data-action="cancel">Cancel</button>
        `;
        item.querySelector('[data-role="input"]')?.focus();
        return;
      }

      const saveOrCancel = event.target.closest('[data-action="save"], [data-action="cancel"]');
      if (saveOrCancel) {
        const item = saveOrCancel.closest('[data-phone]');
        const phoneNumber = item?.dataset.phone;
        if (saveOrCancel.dataset.action === 'cancel') {
          renderPhones(phoneNumbers);
          return;
        }
        const input = item.querySelector('[data-role="input"]');
        const nickname = input?.value.trim();
        if (!nickname) {
          showToast('Nickname cannot be empty');
          return;
        }
        try {
          saveOrCancel.disabled = true;
          await saveNickname(phoneNumber, nickname);
        } catch (err) {
          showToast(err.message || 'Failed to save nickname');
          renderPhones(phoneNumbers);
        }
        return;
      }

      const item = event.target.closest('[data-phone]');
      if (!item) return;
      selectedPool = item.dataset.phone;
      selectedRemote = null;
      updateStatus(allMessages);
      renderAll();
    });

    activityWrap.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="copy-phone"]')) return;
      const btn = event.target.closest('[data-action="open-chat"]');
      if (!btn) return;
      selectedPool = btn.dataset.pool;
      selectedRemote = btn.dataset.remote;
      updateStatus(allMessages);
      renderAll();
    });

    newChatBar.addEventListener('click', (event) => {
      if (!event.target.closest('[data-action="start-chat"]')) return;
      const raw = document.getElementById('new-chat-number')?.value.trim() || '';
      const number = raw.replace(/[^\d+]/g, '');
      if (!number.startsWith('+') || number.length < 10) {
        showToast('Enter a full number like +1…');
        return;
      }
      selectedRemote = number;
      renderAll();
    });

    chatWrap.addEventListener('submit', async (event) => {
      const form = event.target.closest('#chat-compose-form');
      if (!form) return;
      event.preventDefault();
      const input = document.getElementById('chat-compose-input');
      const text = input?.value.trim();
      if (!text) return;
      const btn = form.querySelector('button[type="submit"]');
      try {
        if (btn) btn.disabled = true;
        await sendChatMessage(text);
        if (input) input.value = '';
      } catch (err) {
        showToast(err.message || 'Failed to send');
      } finally {
        if (btn) btn.disabled = false;
      }
    });

    chatHead.addEventListener('click', (event) => {
      if (event.target.closest('[data-action="close-chat"]')) {
        selectedRemote = null;
        renderAll();
      }
    });

    document.addEventListener('click', async (event) => {
      const btn = event.target.closest('[data-action="copy-phone"]');
      if (!btn) return;
      event.preventDefault();
      event.stopPropagation();
      await copyPhoneNumber(btn.dataset.phone);
    });

    phoneSortEl?.addEventListener('change', () => {
      phoneSort = phoneSortEl.value;
      renderPhones(phoneNumbers);
    });

    document.getElementById('refresh-btn').addEventListener('click', refresh);
    document.getElementById('logout-btn').addEventListener('click', async () => {
      await fetch('/api/auth/logout', { method: 'POST' });
      window.location.href = '/login.html';
    });

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
